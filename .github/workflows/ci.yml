name: Test distributions

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }} ${{ matrix.extras }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.10", extras: "" }
          - { os: ubuntu-latest, python: "3.12", extras: "[legacy,semantic]" }
          - { os: windows-latest, python: "3.14", extras: "" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Build the wheel from the source distribution
        run: |
          python -m pip install --upgrade build pytest twine
          python -m build
          python -m twine check --strict dist/*
      - name: Install the built wheel
        env:
          EXTRAS: ${{ matrix.extras }}
        shell: python {0}
        run: |
          import os
          import subprocess
          import sys
          from pathlib import Path

          wheel, = Path("dist").glob("*.whl")
          subprocess.run([sys.executable, "-m", "pip", "install", f"{wheel.resolve()}{os.environ['EXTRAS']}"], check=True)
          subprocess.run([sys.executable, "-m", "pip", "check"], check=True)
      - name: Test the installed package outside the checkout
        working-directory: ${{ runner.temp }}
        env:
          HF_HUB_OFFLINE: "1"
        shell: python {0}
        run: |
          import os
          import subprocess
          import sys
          import tarfile
          from pathlib import Path
          from tempfile import TemporaryDirectory

          archive, = (Path(os.environ["GITHUB_WORKSPACE"]) / "dist").glob("*.tar.gz")
          with TemporaryDirectory() as unpacked:
              with tarfile.open(archive) as sdist:
                  sdist.extractall(unpacked, filter="data")
              tests, = Path(unpacked).glob("*/tests")
              subprocess.run([sys.executable, "-I", "-m", "pytest", "--import-mode=importlib", "-q", str(tests)], check=True)
          from Smarties import TextClassifier

          model = TextClassifier().fit(["a goal", "the moon"], ["sport", "space"])
          assert list(model.predict(["a goal"])) == ["sport"]
